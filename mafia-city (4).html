<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mafia City</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Noto+Sans+Thai:wght@400;700&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --black:#0a0a0a; --deep:#0f0e0c; --card:#141210; --border:#2a2520;
  --gold:#c9a84c; --gold-dim:#7a6330; --red:#8b1a1a; --red-bright:#c0392b;
  --cream:#e8dfc8; --muted:#7a7060; --smoke:#3a3530;
  --mafia:#c0392b; --town:#2e7d52; --detective:#1a5f7a; --doctor:#4a7c59; --jester:#6b4c9a;
  --font-scale:1;
}
[data-theme="light"] {
  --black:#f5f0e8; --deep:#ede8de; --card:#faf6ee; --border:#d4c8a8;
  --cream:#1a1208; --muted:#6a5c40; --smoke:#c8b890; --deep2:#fff8ee;
}
*{margin:0;padding:0;box-sizing:border-box;}
html { font-size: calc(15px * var(--font-scale)); }
body{background:var(--black);color:var(--cream);font-family:'Libre Baskerville',serif;min-height:100vh;overflow-x:hidden;transition:background 0.3s,color 0.3s;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:0.3;}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.7) 100%);pointer-events:none;z-index:998;}
[data-theme="light"] body::after{background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.15) 100%);}
[dir="rtl"]{font-family:'Noto Sans Arabic','Libre Baskerville',serif;}
.lang-ar,.lang-fa{font-family:'Noto Sans Arabic',sans-serif;}
.lang-ja{font-family:'Noto Sans JP',sans-serif;}
.lang-zh,.lang-zh-cn{font-family:'Noto Sans SC',sans-serif;}
.lang-zh-tw{font-family:'Noto Sans TC',sans-serif;}
.lang-th{font-family:'Noto Sans Thai',sans-serif;}
.lang-el,.lang-bg,.lang-uk,.lang-ru{font-family:'Noto Sans',sans-serif;}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;position:relative;z-index:1;padding-bottom:80px;}
.screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center;}

/* ── TOP BAR ── */
.top-bar{position:fixed;top:0;left:0;right:0;z-index:500;display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:10px 16px;background:rgba(10,10,10,0.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);}
[data-theme="light"] .top-bar{background:rgba(245,240,232,0.92);}
.top-bar-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.12em;padding:7px 13px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;}
.top-bar-btn:hover{border-color:var(--gold-dim);color:var(--gold);}
.top-bar-logo{flex:1;font-family:'Playfair Display',serif;font-size:17px;font-weight:900;letter-spacing:0.15em;color:var(--gold);text-transform:uppercase;}

/* ── AD BANNER ── */
.ad-banner{position:fixed;bottom:0;left:0;right:0;background:rgba(10,10,10,0.97);border-top:1px solid var(--border);z-index:490;transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);}
.ad-banner.hidden{transform:translateY(100%);}
[data-theme="light"] .ad-banner{background:rgba(245,240,232,0.97);}
.ad-banner-inner{display:flex;align-items:center;justify-content:center;height:58px;gap:12px;position:relative;}
.ad-banner-label{font-family:'Special Elite',cursive;font-size:9px;letter-spacing:0.2em;color:var(--smoke);text-transform:uppercase;position:absolute;top:6px;left:10px;}
.ad-toggle{position:absolute;top:-26px;right:10px;background:rgba(10,10,10,0.9);border:1px solid var(--border);border-bottom:none;color:var(--muted);font-size:10px;font-family:'Special Elite',cursive;letter-spacing:0.12em;padding:4px 10px;cursor:pointer;transition:color 0.2s;z-index:1;}
[data-theme="light"] .ad-toggle{background:rgba(245,240,232,0.95);}
.ad-toggle:hover{color:var(--gold);}
.ad-slot{width:320px;height:40px;background:rgba(255,255,255,0.03);border:1px dashed var(--smoke);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;font-family:'Special Elite',cursive;letter-spacing:0.1em;}
/* ↑ Replace .ad-slot with: <ins class="adsbygoogle" style="display:inline-block;width:320px;height:50px" data-ad-client="ca-pub-XXXX" data-ad-slot="XXXX"></ins> */

/* ── LANDING ── */
#screen-landing{background:radial-gradient(ellipse 60% 40% at 50% 30%,rgba(139,26,26,0.14) 0%,transparent 70%),linear-gradient(180deg,#0a0a0a 0%,#0f0c0a 100%);padding:60px 20px 40px;text-align:center;gap:0;}
[data-theme="light"] #screen-landing{background:radial-gradient(ellipse 60% 40% at 50% 30%,rgba(139,26,26,0.08) 0%,transparent 70%),linear-gradient(180deg,#f5f0e8 0%,#ede8de 100%);}
.detective-hero{width:130px;height:130px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;margin:0 auto 24px;box-shadow:0 0 50px rgba(201,168,76,0.25),0 0 100px rgba(139,26,26,0.2);animation:pulse-gold 3s ease-in-out infinite;position:relative;}
.detective-hero img{width:100%;height:100%;object-fit:cover;filter:sepia(0.3) contrast(1.1);}
@keyframes pulse-gold{0%,100%{box-shadow:0 0 40px rgba(201,168,76,0.15)}50%{box-shadow:0 0 70px rgba(201,168,76,0.35)}}
.game-title{font-family:'Playfair Display',serif;font-size:clamp(42px,9vw,80px);font-weight:900;letter-spacing:0.12em;color:var(--cream);text-transform:uppercase;line-height:1;text-shadow:0 0 60px rgba(201,168,76,0.2),2px 2px 0 rgba(0,0,0,0.8);margin-bottom:6px;}
.game-subtitle{font-family:'Special Elite',cursive;font-size:12px;letter-spacing:0.35em;color:var(--gold-dim);text-transform:uppercase;margin-bottom:36px;}
.divider{display:flex;align-items:center;gap:14px;width:100%;max-width:380px;margin:0 auto 32px;}
.divider-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
.divider-diamond{width:7px;height:7px;background:var(--gold-dim);transform:rotate(45deg);flex-shrink:0;}
.landing-actions{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;}
.flavor-text{margin-top:32px;font-style:italic;font-size:12px;color:var(--muted);max-width:300px;line-height:1.8;}

/* ── BUTTONS ── */
.btn-primary{background:linear-gradient(135deg,#1a0f0f 0%,#2a1515 100%);border:1px solid var(--gold);color:var(--gold);font-family:'Special Elite',cursive;font-size:13px;letter-spacing:0.15em;text-transform:uppercase;padding:15px 28px;cursor:pointer;position:relative;overflow:hidden;transition:all 0.3s;box-shadow:0 0 20px rgba(139,26,26,0.2);}
.btn-primary:hover{color:var(--cream);box-shadow:0 0 30px rgba(201,168,76,0.25);transform:translateY(-1px);}
.btn-secondary{background:transparent;border:1px solid var(--smoke);color:var(--muted);font-family:'Special Elite',cursive;font-size:12px;letter-spacing:0.15em;text-transform:uppercase;padding:13px 28px;cursor:pointer;transition:all 0.3s;}
.btn-secondary:hover{border-color:var(--muted);color:var(--cream);}
.btn-action{background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--cream);font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:10px 18px;cursor:pointer;transition:all 0.2s;}
.btn-action:hover{border-color:var(--gold-dim);color:var(--gold);}
.btn-action.confirm{border-color:var(--red);color:var(--red-bright);}
.btn-action.confirm:hover{background:rgba(192,57,43,0.1);}

/* ── PANEL ── */
.panel{background:var(--card);border:1px solid var(--border);padding:36px;width:100%;max-width:480px;position:relative;margin-top:50px;}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
.panel-title{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:var(--cream);margin-bottom:6px;}
.panel-desc{font-size:12px;color:var(--muted);margin-bottom:24px;line-height:1.7;}
.back-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.15em;text-transform:uppercase;transition:color 0.2s;display:flex;align-items:center;gap:6px;margin-bottom:20px;}
.back-btn:hover{color:var(--cream);}
.field{margin-bottom:18px;}
.field label{display:block;font-family:'Special Elite',cursive;font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.field input,.field select{width:100%;background:rgba(255,255,255,0.03);border:1px solid var(--border);color:var(--cream);font-family:inherit;font-size:14px;padding:11px 14px;outline:none;transition:border-color 0.2s;-webkit-appearance:none;}
.field input:focus,.field select:focus{border-color:var(--gold-dim);}
.field input::placeholder{color:var(--smoke);}
.field select option{background:#1a1510;}
[data-theme="light"] .field input,[data-theme="light"] .field select{background:rgba(0,0,0,0.04);color:var(--cream);}

/* LINK SHARE */
.link-box{background:rgba(201,168,76,0.05);border:1px solid var(--gold-dim);padding:14px 16px;font-family:'Special Elite',cursive;font-size:13px;color:var(--gold);letter-spacing:0.05em;word-break:break-all;margin-bottom:8px;cursor:pointer;transition:background 0.2s;}
.link-box:hover{background:rgba(201,168,76,0.1);}
.copy-hint{font-size:10px;color:var(--muted);margin-bottom:20px;letter-spacing:0.1em;font-family:'Special Elite',cursive;}

/* TABS */
.tabs{display:flex;width:100%;margin-bottom:20px;}
.tab{flex:1;padding:11px;text-align:center;font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:transparent;transition:all 0.2s;}
.tab.active{border-color:var(--gold-dim);color:var(--gold);background:rgba(201,168,76,0.05);}
.tab:not(:last-child){border-right:none;}

/* ── LOBBY ── */
#screen-lobby{padding:70px 20px 80px;gap:18px;justify-content:flex-start;}
.lobby-header{text-align:center;margin-bottom:6px;}
.lobby-header h2{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;}
.room-tag{font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.25em;color:var(--gold-dim);text-transform:uppercase;margin-top:4px;}
.player-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;width:100%;max-width:660px;}
.player-card{background:var(--card);border:1px solid var(--border);padding:13px 15px;display:flex;align-items:center;gap:10px;animation:fadeIn 0.4s ease;}
.player-card.host{border-color:var(--gold-dim);}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.player-avatar{width:30px;height:30px;background:var(--smoke);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.empty-slot{background:transparent;border:1px dashed var(--smoke);padding:13px 15px;color:var(--smoke);font-size:11px;letter-spacing:0.1em;font-family:'Special Elite',cursive;text-align:center;}
.roles-config{width:100%;max-width:660px;}
.roles-config h3{font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.role-rows{display:flex;flex-direction:column;gap:8px;}
.role-row{display:flex;align-items:center;background:var(--card);border:1px solid var(--border);padding:11px 15px;gap:11px;}
.role-icon{font-size:17px;flex-shrink:0;width:22px;text-align:center;}
.role-info{flex:1;}
.role-name-el{font-size:13px;color:var(--cream);}
.role-desc-el{font-size:10px;color:var(--muted);margin-top:2px;}
.role-count{display:flex;align-items:center;gap:8px;}
.count-btn{width:25px;height:25px;background:var(--smoke);border:none;color:var(--cream);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:background 0.15s;}
.count-btn:hover{background:var(--gold-dim);}
.count-num{font-family:'Special Elite',cursive;font-size:15px;color:var(--gold);min-width:18px;text-align:center;}
.lobby-actions{display:flex;gap:10px;width:100%;max-width:660px;}
.lobby-actions .btn-primary{flex:1;}

/* ── ROLE REVEAL ── */
#screen-role-reveal{background:radial-gradient(ellipse 50% 60% at 50% 50%,rgba(139,26,26,0.08) 0%,transparent 70%);}
.role-card{width:260px;height:380px;background:var(--card);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:transform 0.1s;}
.role-card:hover{transform:scale(1.01);}
.role-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;}
.role-card.mafia::before{background:var(--mafia);}
.role-card.detective::before{background:var(--detective);}
.role-card.doctor::before{background:var(--doctor);}
.role-card.jester::before{background:var(--jester);}
.role-card.villager::before{background:var(--town);}
.role-card-back{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--card);border-radius:1px;}
.role-card-back .eye-icon{font-size:44px;}
.role-card-back p{font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.2em;color:var(--muted);text-transform:uppercase;text-align:center;padding:0 20px;}
.role-card-front{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;}
.role-card.revealed .role-card-back{display:none;}
.role-card.revealed .role-card-front{display:flex;}
.role-big-icon{font-size:60px;}
.role-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;text-align:center;}
.role-title.mafia{color:#ff6b6b;}
.role-title.detective{color:#64b5f6;}
.role-title.doctor{color:#81c784;}
.role-title.jester{color:#ce93d8;}
.role-title.villager{color:#a5d6a7;}
.role-flavor{font-style:italic;font-size:11px;color:var(--muted);text-align:center;line-height:1.6;}
.role-ability-sm{font-size:10px;color:var(--muted);text-align:center;margin-top:4px;line-height:1.4;}
.role-ability-sm strong{color:var(--cream);}
.reveal-whose{font-family:'Playfair Display',serif;font-size:18px;color:var(--cream);margin-bottom:12px;text-align:center;}
.reveal-note{font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.15em;color:var(--muted);text-transform:uppercase;margin-top:18px;text-align:center;}

/* ── NIGHT PASS SCREEN ── */
#screen-night-pass{background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(0,0,20,0.8) 0%,#0a0a0a 100%);}
.pass-box{text-align:center;padding:40px 30px;max-width:380px;}
.pass-icon{font-size:60px;margin-bottom:20px;}
.pass-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:var(--cream);margin-bottom:8px;}
.pass-sub{font-size:13px;color:var(--muted);font-style:italic;line-height:1.7;margin-bottom:28px;}

/* ── NIGHT ACTION SCREEN ── */
#screen-night-action{padding:70px 20px 80px;gap:14px;justify-content:flex-start;}
.night-header{text-align:center;}
.night-player-name{font-family:'Playfair Display',serif;font-size:22px;color:var(--cream);}
.night-role-hint{font-size:12px;color:var(--muted);font-style:italic;margin-top:4px;}

.hidden-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);padding:32px;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;}
.hidden-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
.hidden-card:hover{border-color:var(--gold-dim);}
.hidden-card .lock{font-size:42px;margin-bottom:12px;}
.hidden-card p{font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.18em;color:var(--muted);text-transform:uppercase;}

.action-revealed{width:100%;max-width:480px;display:none;flex-direction:column;gap:12px;}
.action-revealed.show{display:flex;}
.action-box{background:var(--card);border:1px solid var(--border);padding:18px 22px;}
.action-box h3{font-family:'Special Elite',cursive;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.action-text{font-size:13px;color:var(--cream);line-height:1.7;margin-bottom:14px;}
.action-btns{display:flex;gap:10px;flex-wrap:wrap;}

/* ── GAME BOARD ── */
#screen-game{padding:70px 20px 80px;gap:14px;justify-content:flex-start;}
.phase-banner{font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.3em;text-transform:uppercase;padding:7px 22px;border:1px solid;}
.phase-banner.night{color:var(--gold);border-color:var(--gold-dim);background:rgba(201,168,76,0.05);}
.phase-banner.day{color:#c8b070;border-color:#5a4a20;background:rgba(200,176,112,0.04);}
.phase-banner.voting{color:var(--red-bright);border-color:var(--red);background:rgba(192,57,43,0.06);}
.game-title-sm{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;text-align:center;}
.turn-indicator{font-size:12px;color:var(--muted);text-align:center;font-style:italic;}
.players-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;width:100%;max-width:700px;}
.player-tile{background:var(--card);border:1px solid var(--border);padding:13px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:all 0.2s;position:relative;text-align:center;}
.player-tile:hover:not(.dead){border-color:var(--gold-dim);background:rgba(201,168,76,0.04);}
.player-tile.selected{border-color:var(--red-bright);background:rgba(192,57,43,0.08);box-shadow:0 0 16px rgba(192,57,43,0.2);}
.player-tile.dead{opacity:0.32;cursor:default;}
.player-avatar-tile{font-size:22px;}
.player-tile-name{font-size:11px;color:var(--cream);}
.vote-badge{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;font-size:10px;font-family:'Special Elite',cursive;padding:2px 5px;min-width:18px;text-align:center;}
.dead-x{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;color:rgba(192,57,43,0.4);pointer-events:none;}
.action-panel{width:100%;max-width:700px;background:var(--card);border:1px solid var(--border);padding:18px 22px;}
.action-panel h3{font-family:'Special Elite',cursive;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.action-text{font-size:13px;color:var(--cream);line-height:1.7;margin-bottom:14px;}
.action-btns{display:flex;gap:9px;flex-wrap:wrap;}
.log-panel{width:100%;max-width:700px;background:var(--card);border:1px solid var(--border);padding:14px 18px;max-height:150px;overflow-y:auto;}
.log-panel h3{font-family:'Special Elite',cursive;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:9px;}
.log-entry{font-size:11px;color:var(--muted);line-height:1.8;border-bottom:1px solid rgba(255,255,255,0.03);padding:3px 0;font-style:italic;}
.log-entry span{color:var(--cream);}

/* ── VOTING SCREEN ── */
#screen-voting{padding:70px 20px 80px;gap:14px;justify-content:flex-start;}
.voting-header{text-align:center;}
.voter-name-display{font-family:'Special Elite',cursive;font-size:13px;letter-spacing:0.15em;color:var(--gold);text-transform:uppercase;text-align:center;padding:10px;border:1px solid var(--gold-dim);background:rgba(201,168,76,0.04);width:100%;max-width:400px;}
.vote-candidates{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;width:100%;max-width:600px;}
.vote-candidate{background:var(--card);border:1px solid var(--border);padding:13px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:all 0.2s;text-align:center;}
.vote-candidate:hover{border-color:var(--red);background:rgba(192,57,43,0.05);}
.vote-candidate.selected{border-color:var(--red-bright);background:rgba(192,57,43,0.1);box-shadow:0 0 14px rgba(192,57,43,0.2);}
.vote-candidate.self{opacity:0.4;cursor:default;pointer-events:none;}

/* ── GAME OVER ── */
#screen-gameover{background:radial-gradient(ellipse 50% 60% at 50% 50%,rgba(139,26,26,0.15) 0%,transparent 70%);text-align:center;gap:22px;padding:70px 20px 80px;}
.winner-badge{font-size:68px;}
.winner-title{font-family:'Playfair Display',serif;font-size:38px;font-weight:900;}
.winner-title.mafia{color:var(--mafia);}
.winner-title.town{color:var(--town);}
.winner-title.jester{color:var(--jester);}
.winner-desc{font-style:italic;font-size:13px;color:var(--muted);max-width:300px;line-height:1.8;}
.reveal-list{width:100%;max-width:500px;}
.reveal-list h3{font-family:'Special Elite',cursive;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;text-align:left;}
.reveal-row{display:flex;align-items:center;gap:11px;padding:9px 13px;border-bottom:1px solid var(--border);}
.reveal-row .name{flex:1;font-size:12px;}
.reveal-role{font-size:10px;letter-spacing:0.08em;font-family:'Special Elite',cursive;}
.reveal-role.mafia{color:var(--mafia);}
.reveal-role.detective{color:#4a9ebb;}
.reveal-role.doctor{color:#6ab88a;}
.reveal-role.jester{color:#9b6fd4;}
.reveal-role.villager{color:var(--town);}
.gameover-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

/* ── SETTINGS PANEL ── */
.settings-modal{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:700;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
.settings-modal.active{display:flex;}
.settings-box{background:var(--card);border:1px solid var(--border);padding:28px;width:100%;max-width:460px;position:relative;max-height:90vh;overflow-y:auto;margin-top:40px;}
.settings-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
.settings-title{font-family:'Playfair Display',serif;font-size:20px;margin-bottom:20px;color:var(--cream);}
.settings-section{margin-bottom:24px;}
.settings-section h3{font-family:'Special Elite',cursive;font-size:10px;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:8px;}
.settings-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;transition:color 0.2s;}
.settings-close:hover{color:var(--cream);}

/* player list in settings */
.settings-player-item{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(255,255,255,0.03);border:1px solid var(--border);margin-bottom:6px;}
.settings-player-item span{flex:1;font-size:13px;}
.settings-player-item .edit-nick{background:none;border:none;color:var(--gold-dim);cursor:pointer;font-size:12px;font-family:'Special Elite',cursive;letter-spacing:0.1em;text-transform:uppercase;}
.settings-player-item .edit-nick:hover{color:var(--gold);}

/* toggle */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.toggle-label{font-size:13px;color:var(--cream);}
.toggle{position:relative;width:42px;height:22px;}
.toggle input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;inset:0;background:var(--smoke);cursor:pointer;border-radius:22px;transition:background 0.2s;}
.toggle input:checked+.toggle-slider{background:var(--gold-dim);}
.toggle-slider::before{content:'';position:absolute;height:16px;width:16px;left:3px;bottom:3px;background:white;border-radius:50%;transition:transform 0.2s;}
.toggle input:checked+.toggle-slider::before{transform:translateX(20px);}

/* font size control */
.font-size-row{display:flex;align-items:center;gap:12px;padding:10px 0;}
.font-label{flex:1;font-size:13px;color:var(--cream);}
.font-btns{display:flex;gap:6px;}
.font-btn{background:var(--smoke);border:none;color:var(--cream);width:28px;height:28px;cursor:pointer;font-size:13px;transition:background 0.15s;}
.font-btn:hover{background:var(--gold-dim);}
.font-val{font-family:'Special Elite',cursive;font-size:14px;color:var(--gold);min-width:32px;text-align:center;}

/* share link row */
.share-link-row{background:rgba(201,168,76,0.04);border:1px solid var(--gold-dim);padding:10px 14px;display:flex;align-items:center;gap:10px;margin-bottom:8px;cursor:pointer;}
.share-link-row:hover{background:rgba(201,168,76,0.08);}
.share-link-text{flex:1;font-family:'Special Elite',cursive;font-size:12px;color:var(--gold);letter-spacing:0.05em;word-break:break-all;}
.share-icon{font-size:16px;}

/* ── LANG MODAL ── */
.lang-modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:600;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto;}
.lang-modal.active{display:flex;}
.lang-box{background:var(--card);border:1px solid var(--border);padding:26px;width:100%;max-width:560px;position:relative;margin-top:50px;}
.lang-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:5px;}
.lang-option{padding:9px 12px;background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;font-size:13px;transition:all 0.15s;text-align:left;display:flex;align-items:center;gap:8px;}
.lang-option:hover{border-color:var(--gold-dim);color:var(--cream);background:rgba(201,168,76,0.04);}
.lang-option.active{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,0.06);}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;}
.modal-close:hover{color:var(--cream);}

/* ── CUSTOM MODAL ── */
.custom-modal{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.custom-modal.active{display:flex;}
.custom-box{background:var(--card);border:1px solid var(--border);padding:28px;width:100%;max-width:420px;position:relative;}
.custom-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent);}
.custom-role-item{display:flex;align-items:center;gap:9px;padding:7px 11px;background:rgba(255,255,255,0.03);border:1px solid var(--border);margin-bottom:5px;}
.custom-role-item span{flex:1;font-size:12px;}
.custom-role-item button{background:none;border:none;color:var(--red-bright);cursor:pointer;font-size:15px;}

/* scrollbar */
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:var(--deep);}
::-webkit-scrollbar-thumb{background:var(--smoke);}

/* toast */
.toast{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--gold-dim);color:var(--cream);font-family:'Special Elite',cursive;font-size:12px;letter-spacing:0.1em;padding:11px 22px;z-index:9999;white-space:nowrap;animation:toastIn 0.3s ease,toastOut 0.3s ease 2.2s forwards;}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{to{opacity:0;transform:translateX(-50%) translateY(8px)}}

/* night target board reuse */
#night-target-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;width:100%;}
</style>
</head>
<body>

<!-- ══ TOP BAR ══ -->
<div class="top-bar">
  <div class="top-bar-logo">Mafia City</div>
  <button class="top-bar-btn" onclick="openLangModal()">🌐 <span id="current-lang-label">EN</span></button>
  <button class="top-bar-btn" onclick="openSettings()">⚙ <span data-i18n="settings_btn">Settings</span></button>
</div>

<!-- ══ AD BANNER ══ -->
<div class="ad-banner" id="ad-banner">

  <div class="ad-banner-inner">
    <span class="ad-banner-label">Advertisement</span>
    <div class="ad-slot">AD SPACE · 320×50</div>
  </div>
</div>

<!-- ══════════ LANDING ══════════ -->
<section class="screen active" id="screen-landing">
  <div class="detective-hero">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/41/Detective_silhouette.svg/512px-Detective_silhouette.svg.png"
         onerror="this.style.display='none'" alt="Detective"/>
  </div>
  <div class="game-title">Mafia City</div>
  <div class="game-subtitle" data-i18n="subtitle"></div>
  <div class="divider"><div class="divider-line"></div><div class="divider-diamond"></div><div class="divider-line"></div></div>
  <div class="landing-actions">
    <button class="btn-primary" onclick="showScreen('screen-host')" data-i18n="host_btn"></button>
    <button class="btn-primary" onclick="showScreen('screen-join')" style="background:linear-gradient(135deg,#0d0d14,#141420);border-color:#3a4a6a;color:#7090c0;" data-i18n="join_btn"></button>
    <button class="btn-secondary" onclick="showScreen('screen-howtoplay')" data-i18n="how_btn"></button>
  </div>
  <p class="flavor-text" data-i18n="flavor"></p>
</section>

<!-- ══════════ HOW TO PLAY ══════════ -->
<section class="screen" id="screen-howtoplay" style="padding:70px 20px 80px;gap:0;">
  <div class="panel" style="max-width:540px;">
    <button class="back-btn" onclick="showScreen('screen-landing')" data-i18n="back"></button>
    <div class="panel-title" data-i18n="htp_title"></div>
    <div class="panel-desc" style="margin-bottom:18px;" data-i18n="htp_desc"></div>
    <div style="display:flex;flex-direction:column;gap:13px;">
      <div style="display:flex;gap:13px;align-items:flex-start;"><span style="font-size:22px;flex-shrink:0;">🌙</span><div><div style="font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase;margin-bottom:3px;" data-i18n="htp_night_title"></div><div style="font-size:12px;color:var(--muted);line-height:1.7;" data-i18n="htp_night_desc"></div></div></div>
      <div style="display:flex;gap:13px;align-items:flex-start;"><span style="font-size:22px;flex-shrink:0;">☀</span><div><div style="font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase;margin-bottom:3px;" data-i18n="htp_day_title"></div><div style="font-size:12px;color:var(--muted);line-height:1.7;" data-i18n="htp_day_desc"></div></div></div>
      <div style="display:flex;gap:13px;align-items:flex-start;"><span style="font-size:22px;flex-shrink:0;">⚖</span><div><div style="font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase;margin-bottom:3px;" data-i18n="htp_vote_title"></div><div style="font-size:12px;color:var(--muted);line-height:1.7;" data-i18n="htp_vote_desc"></div></div></div>
      <div style="display:flex;gap:13px;align-items:flex-start;"><span style="font-size:22px;flex-shrink:0;">🏆</span><div><div style="font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase;margin-bottom:3px;" data-i18n="htp_win_title"></div><div style="font-size:12px;color:var(--muted);line-height:1.7;" data-i18n="htp_win_desc"></div></div></div>
      <div style="display:flex;gap:13px;align-items:flex-start;"><span style="font-size:22px;flex-shrink:0;">👥</span><div><div style="font-family:'Special Elite',cursive;font-size:11px;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase;margin-bottom:3px;" data-i18n="htp_count_title"></div><div style="font-size:12px;color:var(--muted);line-height:1.7;" data-i18n="htp_count_desc"></div></div></div>
    </div>
    <div style="margin-top:22px;"><button class="btn-primary" onclick="showScreen('screen-landing')" style="width:100%" data-i18n="begin_btn"></button></div>
  </div>
</section>

<!-- ══════════ HOST ══════════ -->
<section class="screen" id="screen-host" style="padding:70px 20px 80px;">
  <div class="panel">
    <button class="back-btn" onclick="showScreen('screen-landing')" data-i18n="back"></button>
    <div class="panel-title" data-i18n="host_title"></div>
    <div class="panel-desc" data-i18n="host_desc"></div>
    <div class="tabs">
      <div class="tab active" onclick="switchHostTab('room')" id="tab-room" data-i18n="tab_room"></div>
      <div class="tab" onclick="switchHostTab('local')" id="tab-local" data-i18n="tab_local"></div>
    </div>
    <div id="host-room-tab">
      <div class="field"><label data-i18n="your_name"></label><input type="text" id="host-name" data-i18n-placeholder="name_placeholder" maxlength="18"/></div>
      <div class="field"><label data-i18n="max_players"></label>
        <select id="host-maxplayers">
          <option value="4">4</option><option value="6">6</option><option value="8" selected>8</option><option value="10">10</option><option value="12">12</option><option value="16">16</option>

    </div>

</section>

<!-- ══════════ ROOM CREATED ══════════ -->
<section class="screen" id="screen-room-created" style="padding:70px 20px 80px;">
  <div class="panel">
    <button class="back-btn" onclick="showScreen('screen-host')" data-i18n="back"></button>
    <div class="panel-title" data-i18n="room_created_title"></div>
    <div class="panel-desc" data-i18n="room_created_desc"></div>

    <div id="waiting-players-list" style="margin-bottom:18px;display:flex;flex-direction:column;gap:5px;"></div>
    <button class="btn-primary" style="width:100%;margin-bottom:10px;" onclick="goToLobby()" data-i18n="to_lobby_btn"></button>
    <button class="btn-secondary" style="width:100%;" onclick="showScreen('screen-landing')" data-i18n="cancel"></button>
  </div>
</section>

<!-- ══════════ JOIN ══════════ -->
<section class="screen" id="screen-join" style="padding:70px 20px 80px;">
  <div class="panel">
    <button class="back-btn" onclick="showScreen('screen-landing')" data-i18n="back"></button>

    <div class="panel-desc" data-i18n="join_desc"></div>

    <button class="btn-primary" style="width:100%" onclick="joinRoom()" data-i18n="enter_btn"></button>

<!-- ══════════ LOBBY ══════════ -->
<section class="screen" id="screen-lobby">
  <div class="lobby-header">
    <h2 data-i18n="lobby_title"></h2>
    <div class="room-tag" id="lobby-room-tag"></div>

    <div class="share-link-row" id="lobby-share-row" onclick="copyLink()" style="margin-top:10px;max-width:460px;cursor:pointer;">
      <span class="share-icon">🔗</span>
      <span class="share-link-text" id="lobby-link-text">—</span>
    </div>
  </div>
  <div class="player-grid" id="lobby-player-grid"></div>

        <div class="role-row" style="margin-top:8px;"><div class="role-icon">🃏</div><div class="role-info"><div class="role-name-el" data-i18n="role_jester"></div><div class="role-desc-el" data-i18n="role_jester_desc"></div></div><div class="role-count"><button class="count-btn" onclick="adjustRole('jester',-1)">−</button><span class="count-num" id="count-jester">0</span><button class="count-btn" onclick="adjustRole('jester',1)">+</button></div></div>

<!-- ══════════ GAME BOARD ══════════ -->

  <div class="game-title-sm" id="game-round-title"></div>
  <div class="turn-indicator" id="turn-indicator"></div>

<!-- ══════════ VOTING SCREEN ══════════ -->
<section class="screen" id="screen-voting">
  <div class="phase-banner voting">⚖ <span data-i18n="vote_phase_label">Vote</span></div>
  <div class="voting-header">
    <div style="font-family:'Playfair Display',serif;font-size:20px;font-weight:700;" id="voting-round-info"></div>
  </div>
  <div class="voter-name-display" id="voter-name-display"></div>
  <p style="font-size:12px;color:var(--muted);font-style:italic;text-align:center;max-width:340px;" data-i18n="vote_instruction"></p>
  <div class="vote-candidates" id="vote-candidates"></div>
  <div style="display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin-top:8px;">
    <button class="btn-action confirm" onclick="confirmVote()" data-i18n="cast_vote_btn"></button>
    <button class="btn-action" onclick="skipVote()" data-i18n="abstain_btn"></button>
  </div>
  <div style="font-size:11px;color:var(--muted);text-align:center;margin-top:6px;" id="vote-progress"></div>
</section>

<!-- ══════════ GAME OVER ══════════ -->
<section class="screen" id="screen-gameover">
  <div class="winner-badge" id="winner-badge">🔪</div>
  <div class="winner-title" id="winner-title"></div>
  <div class="winner-desc" id="winner-desc"></div>
  <div class="reveal-list" id="final-reveal-list"><h3 data-i18n="final_identities"></h3></div>

    <button class="btn-primary" onclick="playAgain()" data-i18n="play_again"></button>
    <button class="btn-secondary" onclick="showScreen('screen-landing')" data-i18n="main_menu"></button>
  </div>
</section>

let currentLang='en', currentLangDef=LANGUAGES[0];

function t(key,vars={}){
  const lang=T[currentLang]||T.en;
  let str=lang[key]??T.en[key]??key;
  Object.entries(vars).forEach(([k,v])=>{str=str.replaceAll(`{${k}}`,v);});
  return str;
}

function applyLang(code){
  const def=LANGUAGES.find(l=>l.code===code)||LANGUAGES[0];
  currentLang=code; currentLangDef=def;
  document.documentElement.lang=code;
  document.documentElement.dir=def.dir;
  document.body.className=def.cls;
  document.getElementById('current-lang-label').textContent=def.flag+' '+code.toUpperCase();
  document.getElementById('settings-lang-display').textContent=def.flag+' '+def.label;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if(el.tagName==='OPTION') el.textContent=t(k);
    else el.textContent=t(k);
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>{
    el.placeholder=t(el.getAttribute('data-i18n-placeholder'));
  });
  document.querySelectorAll('.lang-option').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.code===code);
  });
}

function openLangModal(){document.getElementById('lang-modal').classList.add('active');}
function closeLangModal(){document.getElementById('lang-modal').classList.remove('active');}
function selectLang(code){
  applyLang(code);
  closeLangModal();
  // Re-render any dynamic content on current screen
  const active=document.querySelector('.screen.active');
  if(active){
    const id=active.id;
    if(id==='screen-lobby') renderLobby();
    if(id==='screen-game') updatePhaseLangLabels();
  }
}

function updatePhaseLangLabels(){
  // Refresh phase banner text after lang change
  const banner=document.getElementById('phase-banner');
  if(!banner) return;
  if(state.phase==='night') banner.textContent=t('night_falls');
  else if(state.phase==='day') banner.textContent=t('dawn_breaks');
  else if(state.phase==='voting') banner.textContent=t('vote_phase');
  document.getElementById('turn-indicator').textContent=
    state.phase==='night'?t('night_indicator'):
    state.phase==='day'?t('day_indicator'):
    t('vote_indicator');
}

function buildLangGrid(){
  document.getElementById('lang-grid').innerHTML=LANGUAGES.map(l=>
    `<button class="lang-option ${l.code===currentLang?'active':''}" data-code="${l.code}" onclick="selectLang('${l.code}')">
      <span>${l.flag}</span><span>${l.label}</span>
    </button>`
  ).join('');
}

function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ';return Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join('');}

function getRoomLink(){
  // Works correctly on GitHub Pages, Netlify, and custom domains
  const loc=window.location;
  // Remove index.html if present, keep trailing slash consistent
  const base=(loc.origin+loc.pathname).replace(/\/index\.html$/,'/').replace(/\/$/, '');
  return base+'?room='+state.roomCode;
}

function createRoom(){
  const name=document.getElementById('host-name').value.trim();
  if(!name){toast(t('enter_name'));return;}
  state.roomCode=genCode();
  state.players=[{name,role:null,alive:true,votes:0,isHost:true}];
  renderWaiting();
  showScreen('screen-room-created');
  // Set link AFTER screen is shown so elements exist in DOM
  requestAnimationFrame(()=>{
    const link=getRoomLink();
    const disp=document.getElementById('room-link-display');
    const lobby=document.getElementById('lobby-link-text');
    const sett=document.getElementById('settings-link-text');
    if(disp) disp.textContent=link;
    if(lobby) lobby.textContent=link;
    if(sett) sett.textContent=link;
  });
}

function updateSettingsLink(){
  const link=state.roomCode?getRoomLink():'—';
  document.getElementById('settings-link-text').textContent=link;
}

function copyLink(){
  if(!state.roomCode){toast(t('enter_name'));return;}
  const link=getRoomLink();
  // Try modern clipboard API first
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(link).then(()=>{
      showCopied();
    }).catch(()=>fallbackCopy(link));
  } else {
    fallbackCopy(link);
  }
}
function fallbackCopy(text){
  try{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.cssText='position:fixed;left:-9999px;top:-9999px;opacity:0;';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showCopied();
  }catch(e){
    // Last resort: show the link in a prompt so user can copy manually
    prompt('Copy this link:', text);
  }
}
function showCopied(){
  document.querySelectorAll('[id="copy-hint"]').forEach(h=>{h.textContent=t('copied');});
  setTimeout(()=>document.querySelectorAll('[id="copy-hint"]').forEach(h=>{h.textContent=t('tap_copy');}),2000);
  toast(t('copied'));
}

function renderWaiting(){
  const el=document.getElementById('waiting-players-list');
  el.innerHTML=state.players.map(p=>
    `<div style="display:flex;align-items:center;gap:9px;padding:7px 11px;background:var(--card);border:1px solid var(--border);">
      <span>👤</span><span style="font-size:13px;">${p.name}</span>
      ${p.isHost?`<span style="font-size:10px;color:var(--gold);font-family:'Special Elite',cursive;">${t('host_label')}</span>`:''}
    </div>`
  ).join('');
}

function joinRoom(){
  const name=document.getElementById('join-name').value.trim();
  const code=document.getElementById('join-code').value.trim().toUpperCase();
  if(!name){toast(t('enter_name'));return;}
  if(code.length!==4){toast(t('enter_code'));return;}
  if(code===state.roomCode){
    state.players.push({name,role:null,alive:true,votes:0});
    toast(t('join_room_toast',{name}));
    goToLobby();
  } else {
    state.roomCode=code;
    state.players.push({name,role:null,alive:true,votes:0});
    toast(t('joined_toast',{code}));
    goToLobby();
  }
}

  const params=new URLSearchParams(window.location.search);
  const room=params.get('room');
  if(room&&room.length===4){
    document.getElementById('join-code').value=room.toUpperCase();
    showScreen('screen-join');

}

function startLocalSetup(){
  const count=parseInt(document.getElementById('local-player-count').value);
  if(isNaN(count)||count<4||count>16){toast('4–16');return;}
  let html='';
  for(let i=0;i<count;i++) html+=`<div class="field" style="margin-bottom:9px;"><label>${t('player_label')} ${i+1}</label><input type="text" id="local-p-${i}" placeholder="${t('player_label')} ${i+1}" maxlength="18"/></div>`;
  document.getElementById('local-player-names').innerHTML=html+`<button class="btn-primary" style="width:100%;margin-top:4px;" onclick="confirmLocalPlayers(${count})">${t('to_lobby_btn')}</button>`;
  state.mode='local';
}

function confirmLocalPlayers(count){
  const players=[];
  for(let i=0;i<count;i++){const v=document.getElementById(`local-p-${i}`)?.value.trim()||`${t('player_label')} ${i+1}`;players.push({name:v,role:null,alive:true,votes:0});}
  state.players=players; state.roomCode='LOCAL';
  goToLobby();
}

function goToLobby(){
  document.getElementById('lobby-room-tag').textContent=`Room: ${state.roomCode}`;
  updateSpecialRolesVisibility();
  renderLobby();
  showScreen('screen-lobby');
}

function updateSpecialRolesVisibility(){
  const n=state.players.length;
  const section=document.getElementById('special-roles-rows');
  if(n<6){
    section.style.display='none';
    state.roleCounts.detective=0; state.roleCounts.doctor=0; state.roleCounts.jester=0;
  } else {
    section.style.display='';
    if(state.roleCounts.detective===0) state.roleCounts.detective=1;
    if(state.roleCounts.doctor===0) state.roleCounts.doctor=1;
    ['detective','doctor','jester'].forEach(r=>{ const el=document.getElementById(`count-${r}`); if(el) el.textContent=state.roleCounts[r]; });
  }
}

function renderLobby(){
  const grid=document.getElementById('lobby-player-grid');
  const maxP=parseInt(document.getElementById('host-maxplayers')?.value||8);
  const total=Math.max(state.players.length,Math.min(maxP,8));
  let html='';
  state.players.forEach((p,i)=>{
    html+=`<div class="player-card ${i===0?'host':''}"><div class="player-avatar">${AVATARS[i%AVATARS.length]}</div><div><div style="font-size:13px;color:var(--cream);">${p.name}</div>${i===0?`<div style="font-size:9px;color:var(--gold);">★ ${t('host_label')}</div>`:''}</div></div>`;
  });
  for(let i=state.players.length;i<Math.min(total,8);i++) html+=`<div class="empty-slot">...</div>`;
  grid.innerHTML=html;
  // update share link
  if(state.roomCode&&state.roomCode!=='LOCAL'){
    const link=getRoomLink();
    document.getElementById('lobby-link-text').textContent=link;
    document.getElementById('lobby-share-row').style.display='flex';
  } else {
    document.getElementById('lobby-share-row').style.display='none';
  }
  updateRoleWarning();
}

function adjustRole(role,delta){
  const n=state.players.length;
  if(['detective','doctor','jester'].includes(role)&&n<6){toast('Need 6+ players');return;}
  state.roleCounts[role]=Math.max(0,(state.roleCounts[role]||0)+delta);
  if(role==='mafia') state.roleCounts[role]=Math.max(1,state.roleCounts[role]);
  document.getElementById(`count-${role}`).textContent=state.roleCounts[role];
  updateRoleWarning();
}

function updateRoleWarning(){
  const n=state.players.length;
  const total=Object.values(state.roleCounts).reduce((a,b)=>a+b,0)+state.customRoles.reduce((a,r)=>a+r.count,0);
  const warn=document.getElementById('role-count-warning');
  if(total>n) warn.textContent=t('too_many_roles',{total,n});
  else if(total<n) warn.textContent=t('not_enough_roles',{n:n-total});
  else warn.textContent='';
}

//  CUSTOM ROLES
// ══════════════════════════════════════════════════════
function openCustomModal(){renderCustomRoleList();document.getElementById('custom-modal').classList.add('active');}
function closeCustomModal(){document.getElementById('custom-modal').classList.remove('active');renderLobby();}
function renderCustomRoleList(){
  const el=document.getElementById('custom-role-list');
  if(!state.customRoles.length){el.innerHTML='';return;}
  el.innerHTML=state.customRoles.map((r,i)=>`<div class="custom-role-item"><span>${r.icon}</span><span>${r.name} ×${r.count}</span><button onclick="removeCustomRole(${i})">✕</button></div>`).join('');
}
function addCustomRole(){
  const name=document.getElementById('custom-role-name').value.trim();
  const team=document.getElementById('custom-role-team').value;
  const ability=document.getElementById('custom-role-ability').value.trim();
  const count=parseInt(document.getElementById('custom-role-count').value)||1;
  if(!name){toast(t('enter_name'));return;}
  const icons={town:'🏘',mafia:'🔪',neutral:'⚡'};
  state.customRoles.push({name,team,ability:ability||'Special ability',count,icon:icons[team]||'⭐',flavorText:'A mysterious role.'});
  renderCustomRoleList();
  document.getElementById('custom-role-name').value='';
  document.getElementById('custom-role-ability').value='';
  updateRoleWarning();
  toast(t('added',{name}));
}
function removeCustomRole(i){state.customRoles.splice(i,1);renderCustomRoleList();}

// ══════════════════════════════════════════════════════
//  START GAME
// ══════════════════════════════════════════════════════
function startGame(){
  const n=state.players.length;
  if(n<4){toast(t('need_4'));return;}
  const counts={...state.roleCounts};
  if(n<6){counts.detective=0;counts.doctor=0;counts.jester=0;}
  const pool=[];
  Object.entries(counts).forEach(([role,count])=>{for(let i=0;i<count;i++) pool.push(role);});
  state.customRoles.forEach(r=>{for(let i=0;i<r.count;i++) pool.push('custom_'+r.name);});
  while(pool.length<n) pool.push('villager');
  while(pool.length>n) pool.pop();
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  state.players.forEach((p,i)=>{p.role=pool[i];p.alive=true;p.votes=0;});
  state.round=1; state.phase='night'; state.log=[]; state.currentReveal=0;
  // Shuffle reveal order so roles aren't revealed in role-order
  const revealOrder=state.players.map((_,i)=>i);
  for(let i=revealOrder.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[revealOrder[i],revealOrder[j]]=[revealOrder[j],revealOrder[i]];}
  state.revealOrder=revealOrder;
  beginReveal();
}

// ══════════════════════════════════════════════════════
//  ROLE REVEAL — one card per player
// ══════════════════════════════════════════════════════
function beginReveal(){showScreen('screen-role-reveal');showRevealFor(state.revealOrder[0]);}

function getRoleData(roleStr){
  if(roleStr&&roleStr.startsWith('custom_')){
    const name=roleStr.replace('custom_','');
    const cr=state.customRoles.find(r=>r.name===name);
    return cr?{icon:cr.icon||'⭐',flavorKey:null,abilityKey:null,flavorText:cr.flavorText,ability:cr.ability,class:cr.team==='mafia'?'mafia':'villager',team:cr.team}:ROLE_DATA.villager;
  }
  return ROLE_DATA[roleStr]||ROLE_DATA.villager;
}

function showRevealFor(idx){
  const card=document.getElementById('role-card');
  card.className='role-card';
  const p=state.players[idx];
  document.getElementById('reveal-whose').textContent=p.name;
  document.getElementById('reveal-note').textContent=t('tap_reveal');
  document.getElementById('reveal-next-btn').style.display='none';
  document.getElementById('reveal-start-btn').style.display='none';
  card._pendingReveal=idx;
  state.pendingRevealIdx=idx;
}

function revealRole(){
  const card=document.getElementById('role-card');
  if(card.classList.contains('revealed')) return;
  // Use both sources for safety - DOM property and state variable
  const idx=(card._pendingReveal!==undefined)?card._pendingReveal:state.pendingRevealIdx;
  const p=state.players[idx];
  const rd=getRoleData(p.role);
  const roleName=p.role&&p.role.startsWith('custom_')?p.role.replace('custom_',''):p.role;
  const displayName=roleName.charAt(0).toUpperCase()+roleName.slice(1);
  card.className=`role-card revealed ${rd.class}`;
  // Set emoji icon
  document.getElementById('reveal-icon').textContent=rd.icon||'🃏';
  document.getElementById('reveal-title').textContent=displayName;
  document.getElementById('reveal-title').className=`role-title ${rd.class}`;
  document.getElementById('reveal-flavor').textContent=rd.flavorKey?t(rd.flavorKey):(rd.flavorText||'');
  const ability=rd.abilityKey?t(rd.abilityKey):(rd.ability||'');
  document.getElementById('reveal-ability').innerHTML=ability?`<strong>${t('ability_label')}:</strong> ${ability}`:'';
  document.getElementById('reveal-note').textContent=t('remember_role');
  if(state.currentReveal<state.players.length-1){
    document.getElementById('reveal-next-btn').style.display='';
  } else {
    document.getElementById('reveal-start-btn').style.display='';
    document.getElementById('reveal-note').textContent=t('all_revealed');
  }
}

function nextReveal(){
  state.currentReveal++;
  showRevealFor(state.revealOrder[state.currentReveal]);
}

// ══════════════════════════════════════════════════════
//  GAME START → NIGHT PHASE
// ══════════════════════════════════════════════════════
function beginGame(){
  showScreen('screen-game');
  renderGameBoard();
  startNightPhase();
}

function renderGameBoard(){
  const board=document.getElementById('players-board');
  board.innerHTML=state.players.map((p,i)=>
    `<div class="player-tile ${!p.alive?'dead':''}" id="ptile-${i}">
      <span class="player-avatar-tile">${AVATARS[i%AVATARS.length]}</span>
      <span class="player-tile-name">${p.name}</span>
      ${!p.alive?'<div class="dead-x">✕</div>':''}
    </div>`
  ).join('');
}

// ══════════════════════════════════════════════════════
//  NIGHT PHASE
// ══════════════════════════════════════════════════════
function startNightPhase(){
  state.phase='night';
  state.nightActions={};
  state.protected=null;
  // Build queue
  const queue=[];
  ['mafia','detective','doctor'].forEach(role=>{
    state.players.forEach((p,idx)=>{if(p.alive&&p.role===role) queue.push({playerIdx:idx,role});});
  });
  state.nightQueue=queue; state.nightQueueIdx=0;
  // Update board display
  const banner=document.getElementById('phase-banner');
  banner.className='phase-banner night'; banner.textContent=t('night_falls');
  document.getElementById('game-round-title').textContent=t('round_night',{n:state.round});
  document.getElementById('turn-indicator').textContent=t('night_indicator');
  document.getElementById('action-panel-h3').textContent=t('action_current');
  document.getElementById('action-text').textContent=t('night_indicator');
  document.getElementById('action-btns').innerHTML=queue.length>0
    ?`<button class="btn-action" onclick="beginNightQueue()">☽ ${t('night_falls_short')}</button>`
    :`<button class="btn-action" onclick="resolveNight()">${t('dawn_breaks')}</button>`;
  renderGameBoard();
}

function beginNightQueue(){
  if(state.nightQueue.length===0){resolveNight();return;}
  showNextNightPass();
}

function showNextNightPass(){
  if(state.nightQueueIdx>=state.nightQueue.length){resolveNight();return;}
  const item=state.nightQueue[state.nightQueueIdx];
  const p=state.players[item.playerIdx];
  document.getElementById('night-pass-title').textContent=p.name;
  document.getElementById('night-pass-sub').textContent=t('pass_it');
  document.getElementById('night-pass-btn').textContent=`${t('player_label')}: ${p.name} →`;
  window._nightPassMode='night';
  showScreen('screen-night-pass');
}

function nightPassContinue(){
  if(window._nightPassMode==='voting'){
    window._nightPassMode=null;
    showVotingFor(state.votingQueue[state.votingQueueIdx]);
  } else {
    showNightActionFor(state.nightQueue[state.nightQueueIdx]);
  }
}

function showNightActionFor(item){
  const p=state.players[item.playerIdx];
  const rd=getRoleData(p.role);
  state.selectedNightTarget=null;
  // Reset UI
  document.getElementById('hidden-action-card').style.display='';
  document.getElementById('action-revealed-area').classList.remove('show');
  document.getElementById('night-action-player-name').textContent=p.name;
  document.getElementById('night-role-hint').textContent=`${t('round_night',{n:state.round})}`;
  document.getElementById('night-role-label').textContent=p.role.charAt(0).toUpperCase()+p.role.slice(1);
  // Prepare content (shown after tap)
  let actionText='', btnHtml='';
  if(item.role==='mafia'){
    actionText=t('mafia_action',{name:p.name});
    btnHtml=`<button class="btn-action confirm" onclick="submitNightAction('kill',${item.playerIdx})">${t('confirm_kill')}</button>`;
  } else if(item.role==='detective'){
    actionText=t('detective_action',{name:p.name});
    btnHtml=`<button class="btn-action" onclick="submitNightAction('investigate',${item.playerIdx})">${t('investigate_btn')}</button>`;
  } else if(item.role==='doctor'){
    actionText=t('doctor_action',{name:p.name});
    btnHtml=`<button class="btn-action" onclick="submitNightAction('protect',${item.playerIdx})">${t('protect_btn')}</button>`;
  }
  document.getElementById('night-action-text').textContent=actionText;
  // Build target tiles
  document.getElementById('night-target-board').innerHTML=state.players.map((pl,i)=>{
    if(!pl.alive) return '';
    const isSelf=i===item.playerIdx;
    return `<div class="player-tile ${isSelf?'self':''}" id="ntile-${i}" onclick="${isSelf?'':  `selNight(${i})`}" style="${isSelf?'opacity:0.4;cursor:default;':''}">
      <span class="player-avatar-tile">${AVATARS[i%AVATARS.length]}</span>
      <span class="player-tile-name">${pl.name}${isSelf?' ★':''}</span>
    </div>`;
  }).join('');
  document.getElementById('night-action-btns').innerHTML=btnHtml;
  showScreen('screen-night-action');
}

function revealNightTask(){
  document.getElementById('hidden-action-card').style.display='none';
  document.getElementById('action-revealed-area').classList.add('show');
}

function selNight(idx){
  state.selectedNightTarget=idx;
  document.querySelectorAll('#night-target-board .player-tile').forEach(t=>t.classList.remove('selected'));
  const tile=document.getElementById(`ntile-${idx}`);
  if(tile) tile.classList.add('selected');
}

function submitNightAction(type,actorIdx){
  if(state.selectedNightTarget===null){toast(t('select_player'));return;}
  const target=state.players[state.selectedNightTarget];
  if(!target||!target.alive){toast(t('already_dead'));return;}
  if(type==='kill') state.nightActions.mafiaTarget=state.selectedNightTarget;
  else if(type==='protect') state.protected=state.selectedNightTarget;
  else if(type==='investigate'){
    const rd=getRoleData(target.role);
    const isEvil=rd.team==='mafia';
    toast(t('investigation_result',{name:target.name,result:isEvil?t('is_mafia'):t('not_mafia')}));
  }
  state.selectedNightTarget=null;
  state.nightQueueIdx++;
  showNextNightPass();
}

// ══════════════════════════════════════════════════════
//  RESOLVE NIGHT
// ══════════════════════════════════════════════════════
function resolveNight(){
  let killed=null;
  if(state.nightActions.mafiaTarget!==undefined){
    const ti=state.nightActions.mafiaTarget;
    if(state.protected!==ti){state.players[ti].alive=false;killed=state.players[ti];}
    else addLog(t('log_targeted'));
  }
  if(killed) addLog(t('log_killed',{name:`<span>${killed.name}</span>`,role:`<span>${killed.role}</span>`}));
  else if(state.nightActions.mafiaTarget!==undefined) addLog(t('log_saved'));
  else addLog('☽ The night passed quietly.');
  // Show game board in day mode
  showScreen('screen-game');
  renderGameBoard();
  const banner=document.getElementById('phase-banner');
  banner.className='phase-banner day'; banner.textContent=t('dawn_breaks');
  document.getElementById('game-round-title').textContent=t('round_day',{n:state.round});
  document.getElementById('turn-indicator').textContent=t('day_indicator');
  document.getElementById('action-panel-h3').textContent=t('day_discussion');
  if(killed) document.getElementById('action-text').textContent=`${killed.name} was found dead. They were the ${killed.role}. Discuss — then vote.`;
  else if(state.nightActions.mafiaTarget!==undefined) document.getElementById('action-text').textContent=`Someone was attacked but the Doctor saved them. Discuss — then vote.`;
  else document.getElementById('action-text').textContent=t('day_action_text');
  document.getElementById('action-btns').innerHTML=`<button class="btn-action" onclick="beginVotingPhase()">${t('begin_voting')}</button>`;
  state.phase='day';
  if(checkWin()) return;
}

// ══════════════════════════════════════════════════════
//  VOTING PHASE — each alive player votes once exactly
// ══════════════════════════════════════════════════════
function beginVotingPhase(){
  state.phase='voting';
  state.players.forEach(p=>p.votes=0);
  state.votingQueue=state.players.map((p,i)=>({playerIdx:i,name:p.name})).filter(x=>state.players[x.playerIdx].alive);
  state.votingQueueIdx=0;
  state.selectedVoteTarget=null;
  showNextVoterPass();
}

function showNextVoterPass(){
  if(state.votingQueueIdx>=state.votingQueue.length){tallyVotes();return;}
  const item=state.votingQueue[state.votingQueueIdx];
  const p=state.players[item.playerIdx];
  document.getElementById('night-pass-title').textContent=p.name;
  document.getElementById('night-pass-sub').textContent=t('vote_instruction');
  document.getElementById('night-pass-btn').textContent=`${p.name} — ${t('cast_vote_label')} →`;
  window._nightPassMode='voting';
  showScreen('screen-night-pass');
}

function showVotingFor(item){
  const voter=state.players[item.playerIdx];
  state.selectedVoteTarget=null;
  document.getElementById('voting-round-info').textContent=t('round_night',{n:state.round}).replace('Night','Vote');
  document.getElementById('voter-name-display').textContent=`${voter.name} — ${t('cast_vote_label')}`;
  document.getElementById('vote-progress').textContent=t('vote_progress',{cur:state.votingQueueIdx+1,total:state.votingQueue.length});
  const cands=document.getElementById('vote-candidates');
  cands.innerHTML=state.players.map((p,i)=>{
    if(!p.alive) return '';
    const isSelf=i===item.playerIdx;
    return `<div class="vote-candidate ${isSelf?'self':''}" id="vctile-${i}" onclick="${isSelf?'':  `selVote(${i})`}">
      <span style="font-size:22px;">${AVATARS[i%AVATARS.length]}</span>
      <span style="font-size:11px;color:var(--cream);">${p.name}${isSelf?' ★':''}</span>
    </div>`;
  }).join('');
  showScreen('screen-voting');
}

function selVote(idx){
  state.selectedVoteTarget=idx;
  document.querySelectorAll('.vote-candidate').forEach(t=>t.classList.remove('selected'));
  const tile=document.getElementById(`vctile-${idx}`);
  if(tile) tile.classList.add('selected');
}

function confirmVote(){
  if(state.selectedVoteTarget===null){toast(t('select_player'));return;}
  const target=state.players[state.selectedVoteTarget];
  if(!target||!target.alive){toast(t('already_dead'));return;}
  target.votes++;
  addLog(t('log_voted_against',{name:`<span>${target.name}</span>`}));
  state.votingQueueIdx++;
  showNextVoterPass();
}

function skipVote(){
  addLog('A player abstained.');
  state.votingQueueIdx++;
  showNextVoterPass();
}

// ══════════════════════════════════════════════════════
//  TALLY + WIN CHECK
// ══════════════════════════════════════════════════════
function tallyVotes(){
  showScreen('screen-game');
  renderGameBoard();
  const banner=document.getElementById('phase-banner');
  banner.className='phase-banner voting'; banner.textContent=t('vote_phase');
  document.getElementById('game-round-title').textContent=`Round ${state.round} — Results`;
  const alive=state.players.filter(p=>p.alive);
  const maxVotes=Math.max(...alive.map(p=>p.votes));
  let resultText='';
  if(maxVotes===0){
    addLog(t('log_no_votes')); resultText=t('log_no_votes');
  } else {
    const candidates=alive.filter(p=>p.votes===maxVotes);
    if(candidates.length>1){
      addLog(t('log_tied')); resultText=t('log_tied');
    } else {
      const el=candidates[0]; el.alive=false;
      const roleName=el.role&&el.role.startsWith('custom_')?el.role.replace('custom_',''):el.role;
      addLog(t('log_voted',{name:`<span>${el.name}</span>`,role:`<span>${roleName}</span>`}));
      resultText=`${el.name} was voted out (${roleName}).`;
      if(el.role==='jester'){setTimeout(()=>showGameOver('jester'),800);return;}
    }
  }
  state.players.forEach(p=>p.votes=0);
  renderGameBoard();
  if(checkWin()) return;
  // Start next night
  state.round++;
  document.getElementById('action-panel-h3').textContent='Vote Result';
  document.getElementById('action-text').textContent=resultText;
  document.getElementById('action-btns').innerHTML=`<button class="btn-action" onclick="startNightPhase()">☽ ${t('night_falls_short')} ${state.round}</button>`;
  document.getElementById('turn-indicator').textContent='';
}

function checkWin(){
  const alive=state.players.filter(p=>p.alive);
  const mafiaAlive=alive.filter(p=>getRoleData(p.role).team==='mafia').length;
  const townAlive=alive.filter(p=>getRoleData(p.role).team!=='mafia'&&p.role!=='jester').length;
  if(mafiaAlive===0){showGameOver('town');return true;}
  if(mafiaAlive>=townAlive){showGameOver('mafia');return true;}
  return false;
}

// ══════════════════════════════════════════════════════
//  GAME OVER
// ══════════════════════════════════════════════════════
function showGameOver(winner){
  const cfgs={
    mafia:{badge:'🔪',titleKey:'mafia_wins',cls:'mafia',descKey:'mafia_wins_desc'},
    town:{badge:'⚖',titleKey:'town_wins',cls:'town',descKey:'town_wins_desc'},
    jester:{badge:'🃏',titleKey:'jester_wins',cls:'jester',descKey:'jester_wins_desc'},
  };
  const c=cfgs[winner]||cfgs.town;
  document.getElementById('winner-badge').textContent=c.badge;
  document.getElementById('winner-title').textContent=t(c.titleKey);
  document.getElementById('winner-title').className=`winner-title ${c.cls}`;
  document.getElementById('winner-desc').textContent=t(c.descKey);
  const list=document.getElementById('final-reveal-list');
  list.innerHTML=`<h3>${t('final_identities')}</h3>`+state.players.map((p,i)=>{
    const rd=getRoleData(p.role);
    const roleName=p.role&&p.role.startsWith('custom_')?p.role.replace('custom_',''):p.role;
    return `<div class="reveal-row">
      <span>${AVATARS[i%AVATARS.length]}</span>
      <span class="name">${p.name} ${!p.alive?`<span style="color:var(--muted);font-size:10px;">(${t('eliminated')})</span>`:''}</span>
      <span class="reveal-role ${rd.class}">${roleName}</span>
    </div>`;
  }).join('');
  showScreen('screen-gameover');
}

function playAgain(){
  state.players.forEach(p=>{p.role=null;p.alive=true;p.votes=0;});
  updateSpecialRolesVisibility();
  goToLobby();
}

// ══════════════════════════════════════════════════════
//  LOG + TOAST
// ══════════════════════════════════════════════════════
function addLog(msg){
  state.log.unshift(msg);
  const el=document.getElementById('game-log');
  if(el) el.innerHTML=state.log.slice(0,20).map(l=>`<div class="log-entry">${l}</div>`).join('');
}
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el=document.createElement('div');
  el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2600);
}

//  INIT
// ══════════════════════════════════════════════════════
function toggleAd(){
  const banner=document.getElementById('ad-banner');
  const btn=document.getElementById('ad-toggle-btn');
  const isHidden=banner.classList.toggle('hidden');
  btn.textContent=isHidden?'▼ AD':'▲ AD';
  // keep screens padding consistent
  document.querySelectorAll('.screen').forEach(s=>{
    s.style.paddingBottom=isHidden?'20px':'80px';
  });
}
